name: validate
on: [push, pull_request]
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall -q scripts tools infrastructure tests
      - run: python -m unittest discover -s tests/unit -v
      - run: bash -n infrastructure/provision.sh
      - run: shellcheck infrastructure/provision.sh
      - run: docker compose -f monitoring/compose.yml config --quiet
        env: {GRAFANA_PASSWORD: ci-placeholder}
      - run: docker run --rm --entrypoint promtool -v "$PWD:/repo:ro" prom/prometheus:v3.15.1 check rules /repo/monitoring/prometheus/rules/storage.yml /repo/monitoring/prometheus/rules/backup.yml
      - run: docker run --rm --entrypoint promtool -v "$PWD:/repo:ro" -w /repo/tests/alert-rules prom/prometheus:v3.15.1 test rules jobs.test.yml
